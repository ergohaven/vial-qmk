name: Pre-Release

on:
  workflow_dispatch:

jobs:

  build-ergohaven:
    uses: ./.github/workflows/release-validation.yml

  pre-release:
    name: Pre-Release
    needs:
      - build-ergohaven
    runs-on: ubuntu-latest
    permissions:
      contents: 'write'
      packages: 'write'
      pull-requests: 'read'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ergohaven_fw

      - name: Prepare release assets
        env:
          RELEASE_VERSION: latest
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 util/prepare_ergohaven_release.py \
            --input ergohaven_fw/ergohaven_fw \
            --output release_assets \
            --version "$RELEASE_VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --manifest "$RUNNER_TEMP/qmk-release-assets.json"

      - name: Create Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: '${{ secrets.GITHUB_TOKEN }}'
          automatic_release_tag: 'latest'
          prerelease: true
          title: 'Latest Build'
          files: |
            release_assets/*.uf2