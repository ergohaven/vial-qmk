name: Upstream compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGEX_ANSI_COLOR: 's/\x1b\[[0-9;]*[mGKHF]//g'
  REGEX_MAKE_OUTPUT: '/^g*make\[1]: \(Enter\|Leav\)ing directory ''/d'

permissions: {}

jobs:
  check-uid:
    name: Check all Vial UIDs
    runs-on: ubuntu-latest

    steps:
    - name: (actions) Checkout Vial repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Verify Vial UID is unique per-keyboard
      run: python3 util/ci_vial_verify_uid.py

  build-default:
    name: Build all default keymaps for Vial
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07
    env:
      KEYMAP: default

    steps:
    - name: (actions) Checkout Vial repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: recursive

    - name: Build
      id: build
      run: |
        git config --global --add safe.directory $(pwd)
        if ! qmk mass-compile -j $(nproc) $(qmk find -km vial | sed "s/:vial$/:${KEYMAP}/");
          then
          echo "::error::$(ls -1 .build/failed.log.* | wc -l) keymaps failed to build. See logs and/or job summary for details."
          exit 1
        fi

    - name: Dump failure logs
      if: ${{ failure() && steps.build.conclusion == 'failure' }}
      run: |
        echo '### Failure logs' | tee -a "${GITHUB_STEP_SUMMARY}"

        cd .build || exit 1
        for log in failed.log.*; do
          pretty_logname="$(echo "${log}" | sed "s/^failed\.log\.[0-9]\+\.// ; s/\.${KEYMAP}$//")"

          printf '\n::group::%s\n%s\n::endgroup::\n' "${pretty_logname}" "$(sed "${REGEX_MAKE_OUTPUT}" < "${log}")"
          printf '\n<details>\n<summary>%s</summary>\n\n```\n%s\n```\n\n</details>\n' \
             "${pretty_logname}" "$(sed "${REGEX_MAKE_OUTPUT} ; ${REGEX_ANSI_COLOR}" < "${log}")" >> "${GITHUB_STEP_SUMMARY}"
        done

  build-vial:
    name: Build all Vial keymaps
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07
    env:
      KEYMAP: vial

    steps:
    - name: (actions) Checkout Vial repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: recursive

    - name: Build
      id: build
      run: |
        git config --global --add safe.directory $(pwd)
        set +e
        qmk mass-compile -km "${KEYMAP}" -j $(nproc) > /tmp/qmk-mass-compile.log 2>&1
        build_status=$?
        set -e
        cat /tmp/qmk-mass-compile.log

        sed "${REGEX_ANSI_COLOR}" /tmp/qmk-mass-compile.log \
          | sed -n 's/^Build \(.*\):vial[[:space:]]*\[ERRORS\][[:space:]]*$/\1/p' \
          | sort -u > /tmp/actual-vial-failures.txt

        if ! diff -u .github/upstream-vial-known-failures.txt /tmp/actual-vial-failures.txt;
          then
          echo "::error::Upstream Vial failure baseline changed. Review regressions or remove fixed targets from the allowlist."
          exit 1
        fi

        if [ "${build_status}" -ne 0 ]; then
          echo "::warning::Only the documented upstream Vial baseline failures were observed."
        fi

    - name: Dump failure logs
      if: ${{ failure() && steps.build.conclusion == 'failure' }}
      run: |
        echo '### Failure logs' | tee -a "${GITHUB_STEP_SUMMARY}"

        cd .build || exit 1
        for log in failed.log.*; do
          pretty_logname="$(echo "${log}" | sed "s/^failed\.log\.[0-9]\+\.// ; s/\.${KEYMAP}$//")"

          printf '\n::group::%s\n%s\n::endgroup::\n' "${pretty_logname}" "$(sed "${REGEX_MAKE_OUTPUT}" < "${log}")"
          printf '\n<details>\n<summary>%s</summary>\n\n```\n%s\n```\n\n</details>\n' \
            "${pretty_logname}" "$(sed "${REGEX_MAKE_OUTPUT} ; ${REGEX_ANSI_COLOR}" < "${log}")" >> "${GITHUB_STEP_SUMMARY}"
        done
