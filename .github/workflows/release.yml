name: Release

on:
  push:
    tags:
      - "*"

jobs:

  build-ergohaven:
    uses: ./.github/workflows/release-validation.yml

  pre-release:
    name: Pre-Release
    needs:
      - build-ergohaven
    runs-on: ubuntu-latest
    permissions:
      contents: 'write'
      packages: 'write'
      pull-requests: 'read'

    steps:
      - name: Verify release publisher
        env:
          GH_TOKEN: ${{ secrets.ERGOHAVEN_RELEASE_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          test "$(gh api user --jq .login)" = kissetfall

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ergohaven_fw

      - name: Prepare release notes
        shell: bash
        run: |
          awk -v ver="${GITHUB_REF_NAME}" '
            $0 == "## " ver { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' keyboards/ergohaven/changelog_ru.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > release_notes.md
          fi

      - name: Prepare release assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 util/prepare_ergohaven_release.py \
            --input ergohaven_fw/ergohaven_fw \
            --output release_assets \
            --version "$RELEASE_VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --manifest "$RUNNER_TEMP/qmk-release-assets.json"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.ERGOHAVEN_RELEASE_TOKEN }}
          draft: true
          body_path: release_notes.md
          files: |
            release_assets/*.uf2
