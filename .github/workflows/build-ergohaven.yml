name: Build Ergohaven

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qmk-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Read official firmware targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: targets
        run: |
          matrix="$(python3 util/ci_ergohaven_release_scope.py --matrix)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  build-ergohaven:
    name: Build ${{ matrix.kb }}:${{ matrix.km }}
    needs: matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - name: Checkout firmware and pinned submodules
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential zstd python3-venv python3-dev \
            libudev-dev libusb-1.0-0-dev libffi-dev pkg-config
          python3 -m venv "$RUNNER_TEMP/qmk-venv"
          "$RUNNER_TEMP/qmk-venv/bin/python" -m pip install qmk -r requirements.txt
          echo "$RUNNER_TEMP/qmk-venv/bin" >> "$GITHUB_PATH"
      - name: Install supported ARM toolchain
        timeout-minutes: 10
        run: |
          archive="$RUNNER_TEMP/qmk-toolchains.tar.zst"
          toolchain="$RUNNER_TEMP/qmk-toolchains"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            https://github.com/qmk/qmk_toolchains/releases/download/v15.2.0-1/qmk_toolchains-gcc15.2.0-host_linuxX64.tar.zst \
            --output "$archive"
          printf '%s  %s\n' 6b136919e3526f3f373e91f7d011a006e968a3169262d33cf6efa3e6c605c3ca "$archive" \
            | sha256sum --check --strict
          mkdir -p "$toolchain"
          tar --zstd --extract --file "$archive" --directory "$toolchain" --strip-components=1 --no-same-owner
          test "$("$toolchain/bin/arm-none-eabi-gcc" -dumpfullversion)" = 15.2.0
          "$toolchain/bin/arm-none-eabi-gcc" --version
          printf '%s\n' "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Prepare output name
        env:
          KEYBOARD: ${{ matrix.kb }}
          KEYMAP: ${{ matrix.km }}
        run: printf 'OUTPUT=%s_%s\n' "${KEYBOARD//\//_}" "$KEYMAP" >> "$GITHUB_ENV"
      - name: Compile firmware
        run: qmk compile -kb ${{ matrix.kb }} -km ${{ matrix.km }}
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT }}
          path: '*.uf2'
          if-no-files-found: error
          retention-days: 14

  merge:
    name: Merge output artifacts
    needs: build-ergohaven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: ergohaven_fw
          pattern: ergohaven_*
          delete-merged: true
          retention-days: 14
